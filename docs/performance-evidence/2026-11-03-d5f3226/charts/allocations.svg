  <title id="title">Managed allocations</title>
  <desc id="desc">Average managed allocations per complete encode in KiB for 24 Kodak photographs. Bars start at zero. Includes the returned JPEG; native allocations, retained pool capacity and peak memory were not measured.</desc>
