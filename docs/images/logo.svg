<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">DotJpegli logo</title>
  <desc id="logo-desc">A rounded dark slate badge showing discrete 8x8 DCT quantization blocks transitioning into smooth cyan mountain peaks beneath a warm amber star.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#17253b" />
    </linearGradient>
    <linearGradient id="frame-grad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5cdbca" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0b766e" />
    </linearGradient>
    <linearGradient id="peak-front" x1="96" y1="248" x2="416" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5cdbca" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="peak-back" x1="200" y1="232" x2="424" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="sun-glow" cx="332" cy="172" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="55%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
    <clipPath id="inner-clip">
      <rect x="72" y="72" width="368" height="368" rx="44" />
    </clipPath>
  </defs>

  <!-- Outer squircle -->
  <rect width="512" height="512" rx="104" fill="url(#bg-grad)" />

  <!-- Subtle inner canvas -->
  <rect x="64" y="64" width="384" height="384" rx="52" fill="#0f172a" />

  <g clip-path="url(#inner-clip)">
    <!-- Subtle DCT 8x8 grid lines in top-left quadrant -->
    <g stroke="#1e293b" stroke-width="2" opacity="0.85">
      <line x1="72" y1="120" x2="264" y2="120" />
      <line x1="72" y1="168" x2="264" y2="168" />
      <line x1="72" y1="216" x2="264" y2="216" />
      <line x1="72" y1="264" x2="216" y2="264" />
      <line x1="120" y1="72" x2="120" y2="264" />
      <line x1="168" y1="72" x2="168" y2="264" />
      <line x1="216" y1="72" x2="216" y2="216" />
    </g>

    <!-- Quantization frequency blocks (top-left DC/AC cascade) -->
    <rect x="80" y="80" width="34" height="34" rx="6" fill="#5cdbca" />
    <rect x="126" y="80" width="34" height="34" rx="6" fill="#38bdf8" opacity="0.85" />
    <rect x="172" y="80" width="34" height="34" rx="6" fill="#38bdf8" opacity="0.45" />
    <rect x="218" y="80" width="34" height="34" rx="6" fill="#38bdf8" opacity="0.2" />

    <rect x="80" y="126" width="34" height="34" rx="6" fill="#38bdf8" opacity="0.8" />
    <rect x="126" y="126" width="34" height="34" rx="6" fill="#5cdbca" opacity="0.55" />
    <rect x="172" y="126" width="34" height="34" rx="6" fill="#38bdf8" opacity="0.25" />

    <rect x="80" y="172" width="34" height="34" rx="6" fill="#5cdbca" opacity="0.4" />
    <rect x="126" y="172" width="34" height="34" rx="6" fill="#38bdf8" opacity="0.2" />

    <rect x="80" y="218" width="34" height="34" rx="6" fill="#5cdbca" opacity="0.18" />

    <!-- Warm perceptual focal sun / star -->
    <circle cx="332" cy="172" r="64" fill="#fbbf24" opacity="0.14" />
    <circle cx="332" cy="172" r="44" fill="url(#sun-glow)" />

    <!-- Back mountain ridge -->
    <path d="M216 440 L344 260 L448 376 L448 440 Z" fill="url(#peak-back)" />

    <!-- Front mountain ridge (continuous curve / crisp edge) -->
    <path d="M64 440 L204 248 L308 356 L360 302 L448 404 L448 440 Z" fill="url(#peak-front)" />

    <!-- Baseline accent bar -->
    <rect x="72" y="416" width="368" height="24" fill="#09101d" opacity="0.45" />
  </g>

  <!-- Crisp outer frame stroke -->
  <rect x="64" y="64" width="384" height="384" rx="52" fill="none" stroke="url(#frame-grad)" stroke-width="14" />
</svg>
