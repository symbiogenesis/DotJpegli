    <text x="32.00" y="68" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">Lower is better · DotJpegli only · native allocations were not measured</text>
    <rect x="32" y="90" width="14" height="11" rx="3" fill="#4f46e5"/>
    <text x="55.00" y="100" font-size="13" fill="#334155" font-weight="400" text-anchor="start">Managed KiB / encode</text>
    <text x="915.00" y="100" font-size="12" fill="#64748b" font-weight="400" text-anchor="end">24 photographs · 48 cases per row</text>
