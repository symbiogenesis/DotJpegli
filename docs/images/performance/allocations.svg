<svg xmlns="http://www.w3.org/2000/svg" width="880" height="548" viewBox="0 0 880 548" role="img" aria-labelledby="title desc">
  <title id="title">Allocations per encode</title>
  <desc id="desc">Arithmetic mean allocation traffic for 24 Kodak photographs. DotJpegli bars measure managed GC allocated bytes including headers/alignment; Google C++ jpegli bars measure requested heap bytes, including full realloc requests. Both include returned JPEG. Native allocator overhead, retained capacity and peak memory are excluded. Separate untimed allocation probe, with identical output verified against the uninstrumented reference.</desc>
