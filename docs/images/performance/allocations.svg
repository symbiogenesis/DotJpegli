<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Managed allocations per encode</title>
  <desc id="desc">Arithmetic mean allocated managed bytes per encode, shown in KiB for Kodak photographs. Native allocations were not measured. These values include the returned JPEG and do not measure retained pool capacity or peak memory.</desc>
  <rect x="1" y="1" width="958" height="468" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
