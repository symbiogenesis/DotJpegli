    <text x="454.00" y="348" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">80</text>
    <line x1="552.00" x2="552.00" y1="120" y2="327" stroke="#e2e8f0"/>
    <text x="552.00" y="348" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">120</text>
    <line x1="650.00" x2="650.00" y1="120" y2="327" stroke="#e2e8f0"/>
    <text x="650.00" y="348" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">160</text>
    <line x1="748.00" x2="748.00" y1="120" y2="327" stroke="#e2e8f0"/>
