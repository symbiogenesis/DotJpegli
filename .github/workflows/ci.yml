name: Managed encoder CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Targeted development diagnostic or full quality/performance acceptance'
        type: choice
        options: [targeted, full]
        default: targeted
      framework:
        description: 'Framework for selected cases; .NET 11 uses portable Zip/Unzip/Concat'
        type: choice
        options: [net11.0, net10.0]
        default: net11.0
      images:
        description: 'Targeted image IDs, comma separated (kodim01..kodim24 or fixed control names)'
        default: kodim01
      distances:
        description: 'Targeted distances (1, 4, or 1,4)'
        default: '1'
      samplings:
        description: 'Targeted samplings (444, 420, or 444,420)'
        default: '444,420'
      progressions:
        description: 'Targeted progression levels (0, 2, or 0,2)'
        default: '0,2'
      blocks:
        description: 'Targeted independent blocks (3..7)'
        default: '7'
      warmups:
        description: 'Targeted untimed warmups per block (5..10; pinned native minimum is 5)'
        default: '5'
      iterations:
        description: 'Targeted fixed iterations per block (3..100); blank uses 50ms calibration'
        default: ''
      profile:
        description: 'Collect one instrumented CPU diagnostic after a targeted comparison fails'
        type: boolean
        default: true
      compare_net11:
        description: 'Compare one case for .NET 10/11 runtime changes and explicit .NET 11 SIMD'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net10.0, net11.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.402
      - name: Restore locked dependencies
        run: dotnet restore DotJpegli.slnx --locked-mode
      - run: dotnet build tests/DotJpegli.Tests/DotJpegli.Tests.csproj -c Release -f ${{ matrix.framework }} --no-restore
      - name: Full test suite (CI only)
        run: dotnet run --project tests/DotJpegli.Tests -c Release -f ${{ matrix.framework }} --no-build -- -result-xml "${{ runner.temp }}/dotjpegli-full-tests.xml"
      - name: Slowest test cases
        if: always()
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'dotjpegli-full-tests.xml'
          if (Test-Path -LiteralPath $reportPath) {
            [xml]$report = Get-Content -LiteralPath $reportPath -Raw
            $report.SelectNodes('//test') |
              Sort-Object { [double]$_.time } -Descending |
              Select-Object -First 20 |
              ForEach-Object { '{0}s {1}' -f $_.time, $_.name }
          }
      - name: Managed SIMD fallback and software vector parity
        env:
          DOTNET_EnableHWIntrinsic: '0'
        run: dotnet run --project tests/DotJpegli.Tests -c Release -f ${{ matrix.framework }} --no-build -- -class DotJpegli.Tests.SimdDctTests -class DotJpegli.Tests.PlaneDctTests -class DotJpegli.Tests.Net11DctTransposeTests -class DotJpegli.Tests.Net11DownsamplingTests -class DotJpegli.Tests.AdaptiveQuantizationReuseTests -class DotJpegli.Tests.SimdColorConversionTests -class DotJpegli.Tests.SimdDownsamplingTests -class DotJpegli.Tests.SimdQuantizationTests -class DotJpegli.Tests.PreparedQuantizationTests -class DotJpegli.Tests.OrderedEntropyTests -class DotJpegli.Tests.OrderedProgressiveEntropyTests -class DotJpegli.Tests.SimdAdaptiveQuantizationTests -class DotJpegli.Tests.PlanarPixelSourceTests -class DotJpegli.Tests.EncoderSimdTests -class DotJpegli.Tests.EncoderParallelTests -class DotJpegli.Tests.SourceIccColorManagementTests -class DotJpegli.Tests.NumericalTests -class DotJpegli.Tests.EncoderSmokeTests
      - name: Verify reproducible Release assembly and package
        if: matrix.framework == 'net11.0'
        shell: pwsh
        run: ./tools/verify-reproducibility.ps1

  deployment:
    name: Deployment (${{ matrix.os }}, ${{ matrix.framework }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net10.0, net11.0]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.402
      - name: Restore locked library dependencies
        run: dotnet restore src/DotJpegli/DotJpegli.csproj --locked-mode
      # Publish restores SDK-selected runtime/compiler packs for this RID and mode.
      - name: Publish trimmed consumer (all library methods analyzed)
        run: dotnet publish tests/DotJpegli.AotSmoke/DotJpegli.AotSmoke.csproj -c Release -f ${{ matrix.framework }} -r ${{ matrix.rid }} --self-contained true -p:PublishAot=false -o "${{ runner.temp }}/trimmed-smoke"
      - name: Run trimmed consumer
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          & "${{ runner.temp }}/trimmed-smoke/DotJpegli.AotSmoke$extension"
          if ($LASTEXITCODE -ne 0) { throw 'Trimmed consumer failed.' }
      - name: Publish NativeAOT consumer (all library methods analyzed)
        run: dotnet publish tests/DotJpegli.AotSmoke/DotJpegli.AotSmoke.csproj -c Release -f ${{ matrix.framework }} -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -o "${{ runner.temp }}/aot-smoke"
      - name: Run NativeAOT consumer
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          & "${{ runner.temp }}/aot-smoke/DotJpegli.AotSmoke$extension"
          if ($LASTEXITCODE -ne 0) { throw 'NativeAOT consumer failed.' }

  native-reference:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON((inputs.compare_net11 || (github.event_name == 'push' && contains(github.event.head_commit.message, '[compare-net11]'))) && '["ubuntu-latest","ubuntu-24.04-arm"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Identify native cache toolchain
        id: toolchain
        run: |
          identity=$( { cat /etc/os-release; uname -m; c++ --version; cmake --version; ninja --version; } | sha256sum | cut -d' ' -f1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Restore pinned native executable and provenance
        id: native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/parity-native/jpegli-parity-native
            ${{ runner.temp }}/parity-native/provenance.json
          key: jpegli-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-031a0077f5799a6041004267fc12b956c1f52a20-${{ hashFiles('tools/parity/native/**', 'tools/parity/build-upstream.ps1') }}
      - name: Build unchanged pinned upstream reference
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/parity/build-upstream.ps1 -SourceDirectory "${{ runner.temp }}/parity-upstream" -BuildDirectory "${{ runner.temp }}/parity-native" -Generator Ninja -Parallelism 2
      - name: Verify cached native identity
        run: |
          chmod +x "${{ runner.temp }}/parity-native/jpegli-parity-native"
          test "$("${{ runner.temp }}/parity-native/jpegli-parity-native" version)" = 031a0077f5799a6041004267fc12b956c1f52a20
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'parity-native'
          metadata = json.loads((root / 'provenance.json').read_text(encoding='utf-8-sig'))
          assert metadata['sourceUnmodified'] and metadata['revision'] == '031a0077f5799a6041004267fc12b956c1f52a20'
          assert hashlib.sha256((root / 'jpegli-parity-native').read_bytes()).hexdigest() == metadata['executableSha256']
          PY
      - name: Restore pinned lossless photographic corpus
        id: corpus-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/parity-corpus
          key: jpegli-corpus-v1-${{ hashFiles('tools/parity/corpus.json', 'tools/parity/prepare-corpus.py') }}
      - name: Prepare hash-pinned lossless photographic corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: python3 tools/parity/prepare-corpus.py --output "${{ runner.temp }}/parity-corpus"
      - name: Share reference and corpus with comparison job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-reference-${{ runner.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/parity-native/jpegli-parity-native
            ${{ runner.temp }}/parity-native/provenance.json
            ${{ runner.temp }}/parity-corpus/
          retention-days: 7
          if-no-files-found: error

  performance-targeted:
    if: github.event_name == 'push' || inputs.mode != 'full'
    needs: native-reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.402
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-reference-X64-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore and build performance comparison
        run: |
          chmod +x "${{ runner.temp }}/parity-native/jpegli-parity-native"
          dotnet restore tools/DotJpegli.Performance/DotJpegli.Performance.csproj --locked-mode
          dotnet build tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release --no-restore
      - name: Verify performance evidence policy using synthetic samples
        run: dotnet run --project tools/DotJpegli.Performance -c Release -f ${{ inputs.framework || 'net11.0' }} --no-build -- --self-test
      - name: Compare selected encoding cases (CI only; no full parity verdict)
        id: targeted
        env:
          DOTJPEGLI_PERFORMANCE_REVISION: ${{ github.sha }}
          DOTNET_TieredCompilation: '0'
          TARGET_IMAGES: ${{ inputs.images || 'kodim01' }}
          TARGET_DISTANCES: ${{ inputs.distances || '1' }}
          TARGET_SAMPLINGS: ${{ inputs.samplings || '444,420' }}
          TARGET_PROGRESSIONS: ${{ inputs.progressions || '0,2' }}
          TARGET_BLOCKS: ${{ inputs.blocks || '7' }}
          TARGET_WARMUPS: ${{ inputs.warmups || '5' }}
          TARGET_ITERATIONS: ${{ inputs.iterations }}
        run: |
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          args=(--diagnostic --images "$TARGET_IMAGES" --distances "$TARGET_DISTANCES" --samplings "$TARGET_SAMPLINGS" --progressions "$TARGET_PROGRESSIONS" --blocks "$TARGET_BLOCKS" --warmups "$TARGET_WARMUPS")
          if [[ -n "$TARGET_ITERATIONS" ]]; then args+=(--iterations "$TARGET_ITERATIONS"); fi
          taskset -c "$cpu" dotnet run --project tools/DotJpegli.Performance -c Release -f ${{ inputs.framework || 'net11.0' }} --no-build -- --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/performance-evidence" "${args[@]}"
      - name: Build fixed encoder baseline for a same-host development comparison
        id: baseline_build
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[compare-baseline]') && (steps.targeted.outcome == 'success' || steps.targeted.outcome == 'failure')
        env:
          BASELINE_REVISION: 60835e6ad1613627fe852bd7678a5ef165ec3b43
        run: |
          git fetch --no-tags --depth=1 origin "$BASELINE_REVISION"
          lane="${{ runner.temp }}/encoder-baseline-source"
          mkdir -p "$lane"
          git archive "$BASELINE_REVISION" | tar -x -C "$lane"
          cd "$lane"
          dotnet restore tools/DotJpegli.Performance/DotJpegli.Performance.csproj --locked-mode
          dotnet build tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release -f net11.0 --no-restore -p:SourceRevisionId="$BASELINE_REVISION"
      - name: Measure the baseline serially on the same CPU (CI only)
        if: always() && steps.baseline_build.outcome == 'success' && (steps.targeted.outcome == 'success' || steps.targeted.outcome == 'failure')
        env:
          DOTJPEGLI_PERFORMANCE_REVISION: 60835e6ad1613627fe852bd7678a5ef165ec3b43
          DOTNET_TieredCompilation: '0'
        run: |
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          set +e
          taskset -c "$cpu" dotnet "${{ runner.temp }}/encoder-baseline-source/tools/DotJpegli.Performance/bin/Release/net11.0/DotJpegli.Performance.dll" --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/baseline-evidence" --diagnostic --images kodim01 --distances 1 --samplings 444,420 --progressions 0,2 --blocks 7 --warmups 5
          verdict=$?
          set -e
          if [[ "$verdict" -gt 1 ]]; then exit "$verdict"; fi
      - name: Report same-host encoder comparison without changing acceptance
        if: always() && steps.baseline_build.outcome == 'success' && (steps.targeted.outcome == 'success' || steps.targeted.outcome == 'failure')
        env:
          CURRENT_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          paths = [root / 'baseline-evidence', root / 'performance-evidence']
          runs = [json.loads((p / 'run.json').read_text()) for p in paths]
          summaries = [json.loads((p / 'summary.json').read_text()) for p in paths]
          cases = [json.loads((p / 'cases.json').read_text()) for p in paths]
          assert all(s['valid'] for s in summaries), 'Both comparisons require stable matched evidence'
          assert runs[0]['testedRevision'] == '60835e6ad1613627fe852bd7678a5ef165ec3b43'
          assert runs[1]['testedRevision'] == os.environ['CURRENT_REVISION']
          assert runs[0]['policy'] == runs[1]['policy'], 'Evidence policy mismatch'
          for field in ['nativeExecutableSha256', 'corpusManifestSha256']:
              assert runs[0][field] == runs[1][field], 'Reference/input mismatch'
          for field in ['cpu', 'affinity', 'runtimeProductVersion', 'vectorFloatWidth', 'dotnetTieredCompilation']:
              assert runs[0]['environment'][field] == runs[1]['environment'][field], 'Host/runtime mismatch'
          def key(c): return (c['id'], c['sampling'], c['progressiveLevel'], c['distance'])
          before, after = [{key(c): c for c in items} for items in cases]
          assert before.keys() == after.keys() and len(after) == 4, 'Selected-case mismatch'
          report = '# Same-host encoder development comparison\n\n'
          report += f"Baseline `60835e6`, current `{os.environ['CURRENT_REVISION']}`; CPU: {runs[1]['environment']['cpu']}.\n\n"
          report += 'Both uninstrumented comparisons use the same pinned native executable, corpus, CPU affinity, runtime and fixed evidence policy. The current comparison runs first, then the baseline; source revisions are not interleaved. Native-calibrated iteration counts and all samples are retained. This diagnostic cannot replace the current revision\'s managed/native bounds or establish whole-corpus parity.\n\n'
          report += '| Case | Baseline managed (ms) | Current managed (ms) | Current/baseline managed | Current/baseline native |\n| --- | ---: | ---: | ---: | ---: |\n'
          comparisons = []
          for label in sorted(after):
              b, a = before[label], after[label]
              assert b['managedJpegSha256'] == a['managedJpegSha256'], 'Encoder changed JPEG bytes'
              mr = a['managed']['median'] / b['managed']['median']
              nr = a['native']['median'] / b['native']['median']
              comparisons.append({'case': label, 'managedRatio': mr, 'nativeRatio': nr})
              report += f"| {label[0]}/{label[1]}/p{label[2]}/d{label[3]} | {b['managed']['median']/1e6:.3f} | {a['managed']['median']/1e6:.3f} | {mr:.6f} | {nr:.6f} |\n"
          (root / 'baseline-comparison.md').write_text(report)
          (root / 'baseline-comparison.json').write_text(json.dumps({'baselineRevision': runs[0]['testedRevision'], 'currentRevision': runs[1]['testedRevision'], 'comparisons': comparisons}, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output: output.write(report)
          print(report)
          PY
      - name: Retain the optional same-host baseline diagnostic
        if: always() && steps.baseline_build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-baseline-${{ github.sha }}
          path: |
            ${{ runner.temp }}/baseline-evidence/
            ${{ runner.temp }}/baseline-comparison.*
          retention-days: 30
          if-no-files-found: warn
      - name: Install pinned CPU diagnostic tool after selected-case failure
        id: profiler
        if: failure() && steps.targeted.outcome == 'failure' && (github.event_name == 'push' || inputs.profile)
        continue-on-error: true
        timeout-minutes: 3
        working-directory: ${{ runner.temp }}
        run: dotnet tool install dotnet-trace --version 10.0.750501 --tool-path "${{ runner.temp }}/diagnostic-tools" 2>&1 | tee "${{ runner.temp }}/performance-profile-install.log"
      - name: Profile one encoding case (instrumented diagnostic only)
        id: profile
        if: failure() && steps.targeted.outcome == 'failure' && steps.profiler.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}
        env:
          DOTJPEGLI_PERFORMANCE_REVISION: ${{ github.sha }}
          DOTNET_TieredCompilation: '0'
          DOTJPEGLI_PERFORMANCE_INSTRUMENTATION: 'dotnet-trace 10.0.750501; dotnet-sampled-thread-time; profiling timings are not acceptance evidence'
        run: |
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          read -r image sampling progression distance < <(python3 - <<'PY'
          import json, os
          from pathlib import Path
          cases = json.loads((Path(os.environ['RUNNER_TEMP']) / 'performance-evidence/cases.json').read_text())
          case = max(cases, key=lambda item: item['medianRatio'])
          print(case['id'], case['sampling'], case['progressiveLevel'], case['distance'])
          PY
          )
          taskset -c "$cpu" "${{ runner.temp }}/diagnostic-tools/dotnet-trace" collect --profile dotnet-sampled-thread-time --format Speedscope --show-child-io --output "${{ runner.temp }}/performance-profile.nettrace" -- dotnet "${{ github.workspace }}/tools/DotJpegli.Performance/bin/Release/${{ inputs.framework || 'net11.0' }}/DotJpegli.Performance.dll" --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/profile-evidence" --diagnostic --images "$image" --distances "$distance" --samplings "$sampling" --progressions "$progression" --blocks 3 --iterations 20 --warmups 5 2>&1 | tee "${{ runner.temp }}/performance-profile.log"
      - name: Retain separate instrumented CPU diagnostics
        if: always() && steps.profiler.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-profile-${{ github.sha }}
          path: |
            ${{ runner.temp }}/performance-profile*
            ${{ runner.temp }}/profile-evidence/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish selected-case report in job summary
        if: always()
        run: |
          if [[ -f "${{ runner.temp }}/performance-evidence/report.md" ]]; then cat "${{ runner.temp }}/performance-evidence/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Retain selected-case evidence and native build provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-targeted-${{ github.sha }}
          path: |
            ${{ runner.temp }}/performance-evidence/
            ${{ runner.temp }}/parity-native/provenance.json
            ${{ runner.temp }}/parity-corpus/corpus.json
          retention-days: 30
          if-no-files-found: error

  runtime-comparison:
    if: inputs.compare_net11 || (github.event_name == 'push' && contains(github.event.head_commit.message, '[compare-net11]'))
    needs: native-reference
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.402
            11.0.100-rc.2.26504.105
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-reference-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Build one net10.0 encoder binary with the pinned SDK
        run: |
          chmod +x "${{ runner.temp }}/parity-native/jpegli-parity-native"
          dotnet restore tools/DotJpegli.Performance/DotJpegli.Performance.csproj --locked-mode
          dotnet build tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release -f net10.0 --no-restore
      - name: Build isolated .NET 11 baseline and explicit SIMD experiment
        run: |
          lane="${{ runner.temp }}/net11-simd-source"
          mkdir -p "$lane"
          git archive HEAD | tar -x -C "$lane"
          cd "$lane"
          dotnet restore tools/DotJpegli.Performance/DotJpegli.Performance.csproj --locked-mode
          dotnet publish tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release -f net11.0 --no-restore --no-self-contained -p:DotJpegliNet11Simd=false -o "${{ runner.temp }}/net11-baseline"
          dotnet publish tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release -f net11.0 --no-restore --no-self-contained -p:DotJpegliNet11Simd=true -o "${{ runner.temp }}/net11-simd"
          dotnet restore tests/DotJpegli.Tests/DotJpegli.Tests.csproj --locked-mode
          dotnet build tests/DotJpegli.Tests/DotJpegli.Tests.csproj -c Release -f net11.0 --no-restore -p:DotJpegliNet11Simd=true
          dotnet tests/DotJpegli.Tests/bin/Release/net11.0/DotJpegli.Tests.dll -class DotJpegli.Tests.SimdDctTests -class DotJpegli.Tests.PlaneDctTests -class DotJpegli.Tests.EncoderSimdTests -class DotJpegli.Tests.Net11DctTransposeTests -class DotJpegli.Tests.SimdDownsamplingTests -class DotJpegli.Tests.Net11DownsamplingTests
      - name: Compare one case on both runtimes on the same CPU (CI only)
        working-directory: ${{ runner.temp }}
        env:
          DOTJPEGLI_PERFORMANCE_REVISION: ${{ github.sha }}
          DOTNET_TieredCompilation: '0'
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: '1'
        run: |
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          for runtime in 10.0.13 11.0.0-rc.2.26504.105; do
            set +e
            taskset -c "$cpu" dotnet --fx-version "$runtime" --roll-forward Disable "${{ github.workspace }}/tools/DotJpegli.Performance/bin/Release/net10.0/DotJpegli.Performance.dll" --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/runtime-$runtime" --diagnostic --images kodim01 --distances 1 --samplings 420 --progressions 0 --blocks 7 --iterations 20 --warmups 5
            verdict=$?
            set -e
            if [[ "$verdict" -gt 1 ]]; then exit "$verdict"; fi
          done
          for variant in net11-baseline net11-simd; do
            set +e
            taskset -c "$cpu" dotnet --fx-version 11.0.0-rc.2.26504.105 --roll-forward Disable "${{ runner.temp }}/$variant/DotJpegli.Performance.dll" --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/runtime-$variant" --diagnostic --images kodim01 --distances 1 --samplings 420 --progressions 0 --blocks 7 --iterations 20 --warmups 5
            verdict=$?
            set -e
            if [[ "$verdict" -gt 1 ]]; then exit "$verdict"; fi
          done
      - name: Report runtime and explicit SIMD comparisons
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          versions = ['10.0.13', '11.0.0-rc.2.26504.105', 'net11-baseline', 'net11-simd']
          data = []
          for version in versions:
              path = root / ('runtime-' + version)
              run = json.loads((path / 'run.json').read_text())
              summary = json.loads((path / 'summary.json').read_text())
              cases = json.loads((path / 'cases.json').read_text())
              assert summary['valid'] and len(cases) == 1, 'Runtime comparison needs stable matched evidence'
              expected = '10.0.13' if version == '10.0.13' else '11.0.0-rc.2.26504.105'
              assert run['environment']['runtimeVersion'] == expected.split('-')[0], 'Unexpected runtime version'
              product = run['environment']['runtimeProductVersion']
              assert product == expected or (expected == '10.0.13' and product.startswith(expected + '-servicing.')), 'Unexpected runtime build'
              assert run['environment']['explicitNet11Simd'] == (version == 'net11-simd'), 'Unexpected SIMD experiment build'
              data.append((run, cases[0]))
          left, right, baseline, simd = data
          assert baseline[0]['managedEncoderSha256'] != simd[0]['managedEncoderSha256'], 'SIMD variant must change the encoder binary'
          for field in ['testedRevision', 'managedEncoderSha256', 'managedRunnerSha256', 'nativeExecutableSha256']:
              assert left[0][field] == right[0][field], 'Comparison binary/revision mismatch'
          for run, case in data:
              for field in ['cpu', 'affinity', 'vectorFloatWidth']:
                  assert left[0]['environment'][field] == run['environment'][field], 'Comparison host mismatch'
              assert left[0]['testedRevision'] == run['testedRevision'], 'Comparison source revision mismatch'
              assert left[0]['nativeExecutableSha256'] == run['nativeExecutableSha256'], 'Comparison native mismatch'
              assert left[1]['managedJpegSha256'] == case['managedJpegSha256'], 'Experiment changed JPEG bytes'
          ratio = right[1]['managed']['median'] / left[1]['managed']['median']
          simd_ratio = simd[1]['managed']['median'] / baseline[1]['managed']['median']
          report = '# One-case .NET runtime and portable SIMD API comparison\n\nKodak01 4:2:0 sequential distance 1, same CPU, 7 blocks/20 iterations/5 warmups. The first pair uses identical net10.0 binaries to isolate runtime changes. The second pair uses the pinned .NET 11 SDK and runtime, comparing portable Shuffle/Create lane assembly with Zip/Unzip/Concat in the DCT transpose and downsampling. Both implementations use portable APIs, with no CPU-specific intrinsic paths. All four JPEG hashes must match. No whole-corpus or migration verdict.\n\n'
          report += f"Host: {left[0]['environment']['cpu']}; architecture: {os.environ['RUNNER_ARCH']}.\n\n"
          report += '| Build/runtime | Managed median (ms) | Native median (ms) |\n| --- | ---: | ---: |\n'
          for version, (_, case) in zip(versions, data):
              report += f"| {version} | {case['managed']['median']/1e6:.3f} | {case['native']['median']/1e6:.3f} |\n"
          report += f'\n.NET 11/.NET 10 managed latency ratio: **{ratio:.6f}** (lower is better). JPEG hashes match.\n'
          report += f'\nExplicit .NET 11 SIMD/baseline latency ratio on .NET 11: **{simd_ratio:.6f}** (lower is better). This measures this rewrite only, not all possible new API uses.\n'
          (root / 'runtime-comparison.md').write_text(report)
          (root / 'runtime-comparison.json').write_text(json.dumps({'versions': versions, 'net11OverNet10': ratio, 'explicitSimdOverNet11Baseline': simd_ratio, 'scope': 'one case, same CPU; separate runtime-only and explicit SIMD diagnostics'}, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(report)
          print(report)
          PY
      - name: Retain runtime comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-comparison-${{ runner.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runtime-10.0.13/
            ${{ runner.temp }}/runtime-11.0.0-rc.2.26504.105/
            ${{ runner.temp }}/runtime-net11-baseline/
            ${{ runner.temp }}/runtime-net11-simd/
            ${{ runner.temp }}/runtime-comparison.*
          retention-days: 30
          if-no-files-found: error

  quality-compression-parity:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    needs: native-reference
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-reference-X64-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Make downloaded native executable runnable
        run: chmod +x "${{ runner.temp }}/parity-native/jpegli-parity-native"
      - name: Restore and build managed comparison
        run: |
          dotnet restore tools/DotJpegli.Parity/DotJpegli.Parity.csproj --locked-mode
          dotnet build tools/DotJpegli.Parity/DotJpegli.Parity.csproj -c Release --no-restore
      - name: Verify comparison metrics and rate interpolation
        run: dotnet run --project tools/DotJpegli.Parity -c Release -f net11.0 --no-build -- --self-test
      - name: Compare matched quality and compression (CI only)
        env:
          DOTJPEGLI_PARITY_REVISION: ${{ github.sha }}
        run: dotnet run --project tools/DotJpegli.Parity -c Release -f net11.0 --no-build -- --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/parity-evidence"
      - name: Retain parity evidence and native build provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-compression-parity-${{ github.sha }}
          path: |
            ${{ runner.temp }}/parity-evidence/
            ${{ runner.temp }}/parity-native/provenance.json
            ${{ runner.temp }}/parity-corpus/corpus.json
          retention-days: 30
          if-no-files-found: error
      - name: Restore and build performance comparison
        run: |
          dotnet restore tools/DotJpegli.Performance/DotJpegli.Performance.csproj --locked-mode
          dotnet build tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release --no-restore
      - name: Verify performance statistics and acceptance policy
        run: dotnet run --project tools/DotJpegli.Performance -c Release -f net11.0 --no-build -- --self-test
      - name: Compare steady-state encoding latency (CI only)
        env:
          DOTJPEGLI_PERFORMANCE_REVISION: ${{ github.sha }}
          DOTNET_TieredCompilation: '0'
        run: |
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          taskset -c "$cpu" dotnet run --project tools/DotJpegli.Performance -c Release -f net11.0 --no-build -- --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/performance-evidence"
      - name: Retain performance evidence and native build provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-parity-${{ github.sha }}
          path: |
            ${{ runner.temp }}/performance-evidence/
            ${{ runner.temp }}/parity-native/provenance.json
            ${{ runner.temp }}/parity-corpus/corpus.json
          retention-days: 30
          if-no-files-found: error
