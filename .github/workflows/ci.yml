name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Targeted development diagnostic or full quality/performance acceptance'
        type: choice
        options: [targeted, full]
        default: targeted
      framework:
        description: 'Framework for selected cases; .NET 11 uses portable Zip/Unzip/Concat'
        type: choice
        options: [net11.0, net10.0]
        default: net11.0
      images:
        description: 'Targeted image IDs, comma separated (kodim01..kodim24 or fixed control names)'
        default: kodim01
      distances:
        description: 'Targeted distances (1, 4, or 1,4)'
        default: '1'
      samplings:
        description: 'Targeted samplings (444, 420, or 444,420)'
        default: '444,420'
      progressions:
        description: 'Targeted progression levels (0, 2, or 0,2)'
        default: '0,2'
      blocks:
        description: 'Targeted independent blocks (3..7)'
        default: '7'
      warmups:
        description: 'Targeted untimed warmups per block (5..10; pinned native minimum is 5)'
        default: '5'
      iterations:
        description: 'Targeted fixed iterations per block (3..100); blank uses 50ms calibration'
        default: ''
      profile:
        description: 'Collect bounded instrumented CPU diagnostics after a latency comparison fails'
        type: boolean
        default: true
      compare_net11:
        description: 'Compare one case for .NET 10/11 runtime changes and explicit .NET 11 SIMD'
        type: boolean
        default: false
      performance_workloads:
        description: 'Bounded large-image, memory, parallel and cold/warm workload observations'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET for compiled automation
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Load pinned PowerShell analysis tools
        run: |
          #requires -Version 7.6
          Set-StrictMode -Version 3.0
          $modules = Join-Path $env:RUNNER_TEMP 'powershell-modules'
          [void][System.IO.Directory]::CreateDirectory($modules)
          Save-PSResource -Name PSScriptAnalyzer -Version 1.25.0 -Path $modules -Repository PSGallery -TrustRepository -Quiet
          Save-PSResource -Name powershell-yaml -Version 0.4.12 -Path $modules -Repository PSGallery -TrustRepository -Quiet
          "PSModulePath=$modules$([System.IO.Path]::PathSeparator)$env:PSModulePath" |
            Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8NoBOM
      - name: Analyze every PowerShell file and workflow command
        run: ./tools/ci/analyze-powershell.ps1
      - name: Check automation using synthetic fixtures (no benchmarks)
        run: |
          ./tools/parity/prepare-corpus.ps1 -SelfTest
          ./tools/compare-performance-revisions.ps1 -SelfTest
          ./tools/ci/performance-evidence.ps1 -SelfTest
          ./tools/update-performance-charts.ps1 -SelfTest
          ./tools/assert-infersharp.ps1 -SelfTest
          ./tools/verify-release.ps1 -SelfTest
          ./tools/ci/test-cli-installer.ps1 -SelfTest
          ./tools/Invoke-Automation.ps1 -CommandArguments @('native-reference', '--self-test')
      - name: Regenerate README charts from retained CI measurements (no benchmarks)
        if: matrix.os == 'ubuntu-latest'
        run: |
          $chartOutput = Join-Path $env:RUNNER_TEMP 'readme-performance-charts'
          ./tools/update-performance-charts.ps1 -Performance docs/performance-evidence/2026-11-06-018a34b/full -Quality docs/performance-evidence/2026-11-06-018a34b/quality -Allocations docs/performance-evidence/2026-11-06-018a34b/allocations -Output $chartOutput | Out-Null
          foreach ($name in @('compression.svg', 'wall-time.svg', 'allocations.svg', 'metrics.json')) {
            $expectedHash = (Get-FileHash -LiteralPath (Join-Path 'docs/images/performance' $name) -Algorithm SHA256).Hash
            $actualHash = (Get-FileHash -LiteralPath (Join-Path $chartOutput $name) -Algorithm SHA256).Hash
            if ($expectedHash -cne $actualHash) { throw "README chart does not match retained evidence: $name" }
          }

  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.target.library }} on ${{ matrix.target.framework }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        target:
          - framework: net10.0
            library: net10.0
          - framework: net11.0
            library: net11.0
          - framework: net10.0
            library: netstandard2.1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.403
      - name: Verify all solution dependency locks
        if: matrix.target.library == 'net11.0'
        run: dotnet restore DotJpegli.slnx --locked-mode
      - name: Verify EditorConfig rules
        if: matrix.os == 'ubuntu-latest' && matrix.target.library == 'net11.0'
        env:
          Configuration: Release
        run: |
          dotnet format DotJpegli.slnx --framework net10.0 --no-restore --verify-no-changes --severity info
          dotnet format DotJpegli.slnx --framework net11.0 --no-restore --verify-no-changes --severity info --exclude src/DotJpegli.Cli tests/DotJpegli.Cli.Tests
          dotnet format src/DotJpegli/DotJpegli.csproj --framework netstandard2.1 --no-restore --verify-no-changes --severity info
          DotJpegliLibraryTargetFramework=netstandard2.1 dotnet format tests/DotJpegli.Tests/DotJpegli.Tests.csproj --framework net10.0 --no-restore --verify-no-changes --severity info
      - name: Restore selected library dependencies for tests
        run: dotnet restore tests/DotJpegli.Tests/DotJpegli.Tests.csproj --locked-mode -p:DotJpegliLibraryTargetFramework=${{ matrix.target.library }}
      - run: dotnet build tests/DotJpegli.Tests/DotJpegli.Tests.csproj -c Release -f ${{ matrix.target.framework }} --no-restore -p:DotJpegliLibraryTargetFramework=${{ matrix.target.library }}
      - name: Full test suite (CI only)
        run: dotnet run --project tests/DotJpegli.Tests -c Release -f ${{ matrix.target.framework }} --no-build -p:DotJpegliLibraryTargetFramework=${{ matrix.target.library }} -- -result-xml "${{ runner.temp }}/dotjpegli-full-tests.xml"
      - name: Public CLI tests (CI only)
        if: matrix.target.library == 'net10.0'
        run: dotnet run --project tests/DotJpegli.Cli.Tests -c Release
      - name: Slowest test cases
        if: always()
        shell: pwsh
        run: |
          #requires -Version 7.6
          Set-StrictMode -Version 3.0
          $reportPath = Join-Path $env:RUNNER_TEMP 'dotjpegli-full-tests.xml'
          if (Test-Path -LiteralPath $reportPath) {
            [xml]$report = Get-Content -LiteralPath $reportPath -Raw
            $report.SelectNodes('//test') |
              Sort-Object { [double]::Parse($_.time, [System.Globalization.CultureInfo]::InvariantCulture) } -Descending -Top 20 |
              ForEach-Object { '{0}s {1}' -f $_.time, $_.name }
          }
      - name: Managed SIMD fallback and software vector parity
        if: matrix.target.library != 'netstandard2.1'
        env:
          DOTNET_EnableHWIntrinsic: '0'
        run: dotnet run --project tests/DotJpegli.Tests -c Release -f ${{ matrix.target.framework }} --no-build -p:DotJpegliLibraryTargetFramework=${{ matrix.target.library }} -- -class DotJpegli.Tests.SimdDctTests -class DotJpegli.Tests.PlaneDctTests -class DotJpegli.Tests.Net11DctTransposeTests -class DotJpegli.Tests.Net11DownsamplingTests -class DotJpegli.Tests.AdaptiveQuantizationReuseTests -class DotJpegli.Tests.SimdColorConversionTests -class DotJpegli.Tests.SimdDownsamplingTests -class DotJpegli.Tests.SimdQuantizationTests -class DotJpegli.Tests.PreparedQuantizationTests -class DotJpegli.Tests.OrderedEntropyTests -class DotJpegli.Tests.OrderedProgressiveEntropyTests -class DotJpegli.Tests.SimdAdaptiveQuantizationTests -class DotJpegli.Tests.PlanarPixelSourceTests -class DotJpegli.Tests.EncoderSimdTests -class DotJpegli.Tests.EncoderParallelTests -class DotJpegli.Tests.ParallelEntropyTokenTests -class DotJpegli.Tests.EncoderParallelEntropyTests -class DotJpegli.Tests.SourceIccColorManagementTests -class DotJpegli.Tests.NumericalTests -class DotJpegli.Tests.EncoderSmokeTests -class DotJpegli.Tests.ExifMetadataTests -class DotJpegli.Tests.HuffmanCodingPlanTests -class DotJpegli.Tests.FuzzyErosionSelectionTests -class DotJpegli.Tests.AdaptiveQuantizationWorkspaceTests -class DotJpegli.Tests.FusedPlaneQuantizationTests
      - name: Verify reproducible Release assembly and package
        if: matrix.target.library == 'net11.0'
        shell: pwsh
        run: ./tools/verify-release.ps1 -Reproducibility

  deployment:
    name: Deployment (${{ matrix.os }}, ${{ matrix.framework }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net10.0, net11.0]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.403
      - name: Restore locked library dependencies
        run: dotnet restore src/DotJpegli/DotJpegli.csproj --locked-mode
      # Publish restores SDK-selected runtime/compiler packs for this RID and mode.
      - name: Publish trimmed consumer (all library methods analyzed)
        run: dotnet publish tests/DotJpegli.AotSmoke/DotJpegli.AotSmoke.csproj -c Release -f ${{ matrix.framework }} -r ${{ matrix.rid }} --self-contained true -p:PublishAot=false -o "${{ runner.temp }}/trimmed-smoke"
      - name: Run trimmed consumer
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          #requires -Version 7.6
          Set-StrictMode -Version 3.0
          $PSNativeCommandUseErrorActionPreference = $true
          $extension = $IsWindows ? '.exe' : ''
          & (Join-Path $env:RUNNER_TEMP "trimmed-smoke/DotJpegli.AotSmoke$extension")
      - name: Publish NativeAOT consumer (all library methods analyzed)
        run: dotnet publish tests/DotJpegli.AotSmoke/DotJpegli.AotSmoke.csproj -c Release -f ${{ matrix.framework }} -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -o "${{ runner.temp }}/aot-smoke"
      - name: Run NativeAOT consumer
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          #requires -Version 7.6
          Set-StrictMode -Version 3.0
          $PSNativeCommandUseErrorActionPreference = $true
          $extension = $IsWindows ? '.exe' : ''
          & (Join-Path $env:RUNNER_TEMP "aot-smoke/DotJpegli.AotSmoke$extension")

  cli:
    name: NativeAOT CLI (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.403
      - name: Install Linux packaging tools
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils flatpak librsvg2-common ostree rpm squashfs-tools
      - name: Publish trimmed NativeAOT executable and release packages
        run: ./tools/publish-cli.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -OutputRoot (Join-Path $env:RUNNER_TEMP 'cli')
      - name: Verify CLI release archives, bundles and installers
        run: ./tools/ci/test-cli-installer.ps1 -ArtifactRoot (Join-Path $env:RUNNER_TEMP 'cli') -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Retain installer diagnostics
        if: always() && startsWith(matrix.rid, 'win-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-diagnostics-${{ matrix.rid }}-${{ github.sha }}
          path: ${{ runner.temp }}/cli/msi-*.log
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.rid }}-${{ github.sha }}
          path: ${{ runner.temp }}/cli/release/*
          retention-days: 30
          if-no-files-found: error

  package:
    name: Release NuGet package
    needs: [powershell, test, deployment, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore src/DotJpegli/DotJpegli.csproj --locked-mode
      - name: Pack all library targets once
        run: dotnet pack src/DotJpegli/DotJpegli.csproj -c Release --no-restore --output "${{ runner.temp }}/nuget" -p:ContinuousIntegrationBuild=true -p:RepositoryBranch=refs/heads/main
      - name: Verify package contents and provenance
        shell: pwsh
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          #requires -Version 7.6
          Set-StrictMode -Version 3.0
          $PSNativeCommandUseErrorActionPreference = $true
          $packages = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'nuget') -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one NuGet package.' }
          $version = dotnet msbuild src/DotJpegli/DotJpegli.csproj -nologo -getProperty:PackageVersion
          ./tools/verify-release.ps1 -PackagePath $packages[0].FullName -ExpectedVersion $version -ExpectedRevision $env:EXPECTED_REVISION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-${{ github.sha }}
          path: ${{ runner.temp }}/nuget/*.nupkg
          retention-days: 30
          if-no-files-found: error

  native-reference:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON((inputs.compare_net11 || (github.event_name == 'push' && contains(github.event.head_commit.message, '[compare-net11]'))) && '["ubuntu-latest","ubuntu-24.04-arm"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET for compiled automation
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Identify native cache toolchain
        id: toolchain
        run: |
          identity=$( { cat /etc/os-release; uname -m; c++ --version; cmake --version; ninja --version; } | sha256sum | cut -d' ' -f1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Restore pinned native executable and provenance
        id: native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/parity-native/jpegli-parity-native
            ${{ runner.temp }}/parity-native/jpegli-allocation-native
            ${{ runner.temp }}/parity-native/provenance.json
          key: jpegli-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-031a0077f5799a6041004267fc12b956c1f52a20-${{ hashFiles('tools/parity/native/**', 'tools/parity/build-upstream.ps1') }}
      - name: Build unchanged pinned upstream reference
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/parity/build-upstream.ps1 -SourceDirectory "${{ runner.temp }}/parity-upstream" -BuildDirectory "${{ runner.temp }}/parity-native" -Generator Ninja -Parallelism 2
      - name: Verify cached native identity
        run: |
          chmod +x "${{ runner.temp }}/parity-native/jpegli-parity-native"
          chmod +x "${{ runner.temp }}/parity-native/jpegli-allocation-native"
          "${{ runner.temp }}/parity-native/jpegli-allocation-native" allocation-self-test
          test "$("${{ runner.temp }}/parity-native/jpegli-parity-native" version)" = 031a0077f5799a6041004267fc12b956c1f52a20
          pwsh -NoProfile -File tools/parity/build-upstream.ps1 -VerifyOnly -BuildDirectory "${{ runner.temp }}/parity-native"
      - name: Restore pinned lossless photographic corpus
        id: corpus-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/parity-corpus
          key: jpegli-corpus-v1-${{ hashFiles('tools/parity/corpus.json', 'tools/parity/prepare-corpus.ps1', 'tools/DotJpegli.Automation/Corpus*.cs') }}
      - name: Prepare hash-pinned lossless photographic corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/parity/prepare-corpus.ps1 -Output "${{ runner.temp }}/parity-corpus"
      - name: Share reference and corpus with comparison job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-reference-${{ runner.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/parity-native/jpegli-parity-native
            ${{ runner.temp }}/parity-native/jpegli-allocation-native
            ${{ runner.temp }}/parity-native/provenance.json
            ${{ runner.temp }}/parity-corpus/
          retention-days: 7
          if-no-files-found: error

  allocation-evidence:
    name: Managed and Google C++ jpegli allocations
    needs: native-reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-reference-X64-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Verify unmodified native reference and allocation probe
        shell: pwsh
        run: |
          chmod +x "${{ runner.temp }}/parity-native/jpegli-parity-native" "${{ runner.temp }}/parity-native/jpegli-allocation-native"
          ./tools/parity/build-upstream.ps1 -VerifyOnly -BuildDirectory "${{ runner.temp }}/parity-native"
      - name: Build allocation observer
        run: |
          dotnet restore tools/DotJpegli.Performance/DotJpegli.Performance.csproj --locked-mode
          dotnet build tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release -f net11.0 --no-restore
      - name: Observe complete Kodak allocation traffic without timing (CI only)
        env:
          DOTNET_TieredCompilation: '0'
        run: dotnet run --project tools/DotJpegli.Performance -c Release -f net11.0 --no-build -- --allocation-evidence --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/allocation-evidence"
      - name: Retain allocation observations and native provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allocation-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/allocation-evidence/
            ${{ runner.temp }}/parity-native/provenance.json
            ${{ runner.temp }}/parity-corpus/corpus.json
          retention-days: 30
          if-no-files-found: error

  encoder-comparison:
    name: Encoder batch (${{ matrix.architecture }}, ${{ matrix.framework }})
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[compare-encoder]')
    needs: native-reference
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: X64
            framework: net10.0
          - runner: ubuntu-latest
            architecture: X64
            framework: net11.0
          - runner: ubuntu-24.04-arm
            architecture: ARM64
            framework: net10.0
          - runner: ubuntu-24.04-arm
            architecture: ARM64
            framework: net11.0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # Fixed pre-batch source: isolate these changes from earlier optimizations.
      BASELINE_REVISION: b2fa25da8fdbe601daf145b93f297fcf01a5caa1
      DOTNET_TieredCompilation: '0'
      # Exercise the eight-lane AQ schedule even on wide-SIMD x64 runners.
      DOTNET_EnableAVX512F: ${{ matrix.architecture == 'X64' && '0' || '1' }}
      DOTNET_EnableAVX512: ${{ matrix.architecture == 'X64' && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.403
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-reference-X64-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Build current worker and verify affected kernels
        run: |
          dotnet restore tools/DotJpegli.Performance/DotJpegli.Performance.csproj --locked-mode
          dotnet build tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release -f ${{ matrix.framework }} --no-restore -p:SourceRevisionId="${{ github.sha }}"
          dotnet tools/DotJpegli.Performance/bin/Release/${{ matrix.framework }}/DotJpegli.Performance.dll --self-test-revision-comparison
          dotnet restore tests/DotJpegli.Tests/DotJpegli.Tests.csproj --locked-mode
          dotnet build tests/DotJpegli.Tests/DotJpegli.Tests.csproj -c Release -f ${{ matrix.framework }} --no-restore
          dotnet tests/DotJpegli.Tests/bin/Release/${{ matrix.framework }}/DotJpegli.Tests.dll -filterVSTest 'FullyQualifiedName~FusedPlaneQuantizationTests|FullyQualifiedName~FusedBlockPreparationTests|FullyQualifiedName~BatchedAdaptiveFinalizationTests|FullyQualifiedName~SimdAdaptiveQuantizationTests|FullyQualifiedName~SourceIccColorManagementTests' -result-xml "${{ runner.temp }}/encoder-batch-tests.xml" -noLogo
      - name: Build pre-batch encoder with the identical worker
        run: |
          git fetch --no-tags --depth=1 origin "$BASELINE_REVISION"
          lane="${{ runner.temp }}/encoder-batch-baseline-source"
          worker="${{ runner.temp }}/encoder-batch-baseline-worker"
          mkdir -p "$lane" "$worker"
          git archive "$BASELINE_REVISION" | tar -x -C "$lane"
          dotnet restore "$lane/src/DotJpegli/DotJpegli.csproj" --locked-mode
          dotnet build "$lane/src/DotJpegli/DotJpegli.csproj" -c Release -f ${{ matrix.framework }} --no-restore -p:SourceRevisionId="$BASELINE_REVISION"
          cp "${{ github.workspace }}/tools/DotJpegli.Performance/bin/Release/${{ matrix.framework }}/"* "$worker/"
          cp "$lane/src/DotJpegli/bin/Release/${{ matrix.framework }}/DotJpegli.dll" "$worker/DotJpegli.dll"
      - name: Interleave ordinary encodes against pre-batch source (CI only)
        id: ordinary
        run: |
          cpu=$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)
          taskset -c "$cpu" dotnet tools/DotJpegli.Performance/bin/Release/${{ matrix.framework }}/DotJpegli.Performance.dll --compare-revisions --baseline-runner "${{ runner.temp }}/encoder-batch-baseline-worker/DotJpegli.Performance.dll" --baseline-revision "$BASELINE_REVISION" --current-revision "${{ github.sha }}" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/encoder-batch/ordinary" --images kodim01,kodim13,kodim19,kodim23,smooth-gradient,low-noise,low-contrast,tiny-odd-edges --distances 1,4 --samplings 444,420 --progressions 0,2 --blocks 6 --iterations 20 --warmups 5
      - name: Interleave source ICC encodes against pre-batch source (CI only)
        if: always() && (steps.ordinary.outcome == 'success' || steps.ordinary.outcome == 'failure')
        run: |
          cpu=$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)
          taskset -c "$cpu" dotnet tools/DotJpegli.Performance/bin/Release/${{ matrix.framework }}/DotJpegli.Performance.dll --compare-revisions --source-icc --baseline-runner "${{ runner.temp }}/encoder-batch-baseline-worker/DotJpegli.Performance.dll" --baseline-revision "$BASELINE_REVISION" --current-revision "${{ github.sha }}" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/encoder-batch/source-icc" --images kodim01 --distances 1 --samplings 444,420 --progressions 0,2 --blocks 6 --iterations 20 --warmups 5
      - name: Interleave affected optional and constrained-cache paths (CI only)
        if: always() && (steps.ordinary.outcome == 'success' || steps.ordinary.outcome == 'failure')
        run: |
          cpu=$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)
          status=0
          for scenario in smoothing xyb cache-constrained sampled-icc; do
            taskset -c "$cpu" dotnet tools/DotJpegli.Performance/bin/Release/${{ matrix.framework }}/DotJpegli.Performance.dll --compare-revisions --scenario "$scenario" --baseline-runner "${{ runner.temp }}/encoder-batch-baseline-worker/DotJpegli.Performance.dll" --baseline-revision "$BASELINE_REVISION" --current-revision "${{ github.sha }}" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/encoder-batch/$scenario" --images kodim01 --distances 1,4 --samplings 444,420 --progressions 0,2 --blocks 6 --iterations 20 --warmups 5 || status=$?
          done
          exit "$status"
      - name: Interleave two-worker encodes with multiple available CPUs (CI only)
        if: always() && (steps.ordinary.outcome == 'success' || steps.ordinary.outcome == 'failure')
        run: |
          test "$(nproc)" -ge 2
          cpu_set=$(awk '/^Cpus_allowed_list:/ { print $2 }' /proc/self/status)
          taskset -c "$cpu_set" dotnet tools/DotJpegli.Performance/bin/Release/${{ matrix.framework }}/DotJpegli.Performance.dll --compare-revisions --scenario parallel-two --baseline-runner "${{ runner.temp }}/encoder-batch-baseline-worker/DotJpegli.Performance.dll" --baseline-revision "$BASELINE_REVISION" --current-revision "${{ github.sha }}" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/encoder-batch/parallel-two" --images kodim01 --distances 1,4 --samplings 444,420 --progressions 0,2 --blocks 6 --iterations 20 --warmups 5
      - name: Retain batch comparisons and affected-kernel tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encoder-batch-${{ matrix.architecture }}-${{ matrix.framework }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/encoder-batch/
            ${{ runner.temp }}/encoder-batch-tests.xml
          retention-days: 30
          if-no-files-found: warn
      - name: Publish both batch comparison reports
        if: always()
        run: |
          for comparison in ordinary source-icc smoothing xyb cache-constrained sampled-icc parallel-two; do
            if [[ -f "${{ runner.temp }}/encoder-batch/$comparison/report.md" ]]; then
              cat "${{ runner.temp }}/encoder-batch/$comparison/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  followup-research:
    name: Bounded compression experiments
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[followup-research]')
    needs: native-reference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_TieredCompilation: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-reference-X64-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Build bounded experiment commands
        run: |
          chmod +x "${{ runner.temp }}/parity-native/jpegli-parity-native"
          dotnet restore tools/DotJpegli.Parity/DotJpegli.Parity.csproj --locked-mode
          dotnet build tools/DotJpegli.Parity/DotJpegli.Parity.csproj -c Release --no-restore
      - name: Search actual stuffed Huffman output
        run: dotnet tools/DotJpegli.Parity/bin/Release/net11.0/DotJpegli.Parity.dll --search-huffman-orderings --input "${{ runner.temp }}/parity-corpus/kodim01.ppm" --output "${{ runner.temp }}/followup-research/huffman" --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --distance 1 --sampling 420 --progression 2
      - name: Search cross-block DC candidates
        if: always()
        run: dotnet tools/DotJpegli.Parity/bin/Release/net11.0/DotJpegli.Parity.dll --search-dc-trellis --input "${{ runner.temp }}/parity-corpus/kodim01.ppm" --output "${{ runner.temp }}/followup-research/dc" --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --sampling 420
      - name: Search image-specific Huffman feedback
        if: always()
        run: dotnet tools/DotJpegli.Parity/bin/Release/net11.0/DotJpegli.Parity.dll --search-huffman-feedback --input "${{ runner.temp }}/parity-corpus/kodim01.ppm" --output "${{ runner.temp }}/followup-research/feedback" --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --sampling 420
      - name: Search reconstruction-aware chroma and saturated-edge candidates
        if: always()
        run: dotnet tools/DotJpegli.Parity/bin/Release/net11.0/DotJpegli.Parity.dll --search-color-preprocessing --input "${{ runner.temp }}/parity-corpus/kodim01.ppm" --output "${{ runner.temp }}/followup-research/color" --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --distance 1 --sampling 420
      - name: Retain all controls candidates and quality decisions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: followup-research-${{ github.sha }}
          path: ${{ runner.temp }}/followup-research/
          retention-days: 30
          if-no-files-found: warn

  performance-workloads:
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[performance-workloads]')) || (github.event_name == 'workflow_dispatch' && inputs.performance_workloads)
    needs: native-reference
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: X64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-reference-X64-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Build workload observations
        run: |
          dotnet restore tools/DotJpegli.Performance/DotJpegli.Performance.csproj --locked-mode
          dotnet build tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release -f net11.0 --no-restore
          dotnet tools/DotJpegli.Performance/bin/Release/net11.0/DotJpegli.Performance.dll --self-test-workloads
      - name: Measure bounded workloads serially (CI only)
        run: dotnet tools/DotJpegli.Performance/bin/Release/net11.0/DotJpegli.Performance.dll --workload-diagnostics --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/workload-evidence"
      - name: Retain all workload observations, including incomplete runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-workloads-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/workload-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Publish workload report
        if: always()
        run: |
          if [[ -f "${{ runner.temp }}/workload-evidence/report.md" ]]; then
            cat "${{ runner.temp }}/workload-evidence/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  kernel-comparison:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[compare-kernels]')
    needs: native-reference
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: X64
            framework: net10.0
          - runner: ubuntu-latest
            architecture: X64
            framework: net11.0
          - runner: ubuntu-24.04-arm
            architecture: ARM64
            framework: net10.0
          - runner: ubuntu-24.04-arm
            architecture: ARM64
            framework: net11.0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DOTNET_TieredCompilation: '0'
      # .NET 10 and .NET 11 recognize different AVX-512 diagnostic names.
      DOTNET_EnableAVX512F: '0'
      DOTNET_EnableAVX512: '0'
      DOTJPEGLI_PERFORMANCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.403
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Pixel inputs are architecture-independent; no native binary is run.
          name: parity-reference-X64-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore and build kernel comparison
        run: |
          dotnet restore tools/DotJpegli.Performance/DotJpegli.Performance.csproj --locked-mode
          dotnet build tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release -f ${{ matrix.framework }} --no-restore
      - name: Check comparison statistics with synthetic samples
        id: kernel_statistics
        run: dotnet run --project tools/DotJpegli.Performance -c Release -f ${{ matrix.framework }} --no-build -- --self-test-kernel-comparison
      - name: Interleave original and optimized encodes on one CPU (CI only)
        run: |
          cpu=$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)
          taskset -c "$cpu" dotnet "${{ github.workspace }}/tools/DotJpegli.Performance/bin/Release/${{ matrix.framework }}/DotJpegli.Performance.dll" --compare-kernels --include-automatic --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/kernel-evidence" --images kodim01,low-noise,low-contrast,tiny-odd-edges,guard-below-32k,guard-at-32k,guard-above-32k,narrow-tall --distances 1,4 --samplings 444,420 --progressions 0,2 --blocks 6 --warmups 5 --iterations 20
      - name: Interleave intermediate-size controls on the same CPU (CI only)
        if: ${{ !cancelled() && steps.kernel_statistics.outcome == 'success' }}
        run: |
          cpu=$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)
          taskset -c "$cpu" dotnet "${{ github.workspace }}/tools/DotJpegli.Performance/bin/Release/${{ matrix.framework }}/DotJpegli.Performance.dll" --compare-kernels --include-automatic --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/kernel-intermediate-evidence" --images intermediate-64k,intermediate-128k --distances 1,4 --samplings 444,420 --progressions 0,2 --blocks 6 --warmups 5 --iterations 20
      - name: Check actual comparison capabilities
        if: always()
        shell: pwsh
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: ./tools/ci/performance-evidence.ps1 -AssertSimd -Evidence "${{ runner.temp }}/kernel-evidence", "${{ runner.temp }}/kernel-intermediate-evidence" -Architecture $env:EXPECTED_ARCHITECTURE
      - name: Retain interleaved kernel evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-comparison-${{ matrix.architecture }}-${{ matrix.framework }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kernel-evidence/
            ${{ runner.temp }}/kernel-intermediate-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Publish kernel comparison report
        if: always()
        run: |
          if [[ -f "${{ runner.temp }}/kernel-evidence/report.md" ]]; then
            cat "${{ runner.temp }}/kernel-evidence/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "${{ runner.temp }}/kernel-intermediate-evidence/report.md" ]]; then
            cat "${{ runner.temp }}/kernel-intermediate-evidence/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  performance-targeted:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[full-parity]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'full')
    needs: native-reference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASELINE_REVISION: 2ef3d5fcc12a804c7cd707446091eb74fa9c6476
      TARGET_IMAGES: ${{ inputs.images || (contains(github.event.head_commit.message, '[compare-baseline]') && 'kodim01,low-noise,low-contrast,tiny-odd-edges') || 'kodim01' }}
      TARGET_DISTANCES: ${{ inputs.distances || (contains(github.event.head_commit.message, '[compare-baseline]') && '1,4') || '1' }}
      TARGET_SAMPLINGS: ${{ inputs.samplings || '444,420' }}
      TARGET_PROGRESSIONS: ${{ inputs.progressions || '0,2' }}
      TARGET_BLOCKS: ${{ inputs.blocks || '7' }}
      TARGET_WARMUPS: ${{ inputs.warmups || '5' }}
      TARGET_ITERATIONS: ${{ inputs.iterations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.403
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-reference-X64-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore and build performance comparison
        run: |
          chmod +x "${{ runner.temp }}/parity-native/jpegli-parity-native"
          dotnet restore tools/DotJpegli.Performance/DotJpegli.Performance.csproj --locked-mode
          dotnet build tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release --no-restore
      - name: Verify performance evidence policy using synthetic samples
        run: |
          dotnet run --project tools/DotJpegli.Performance -c Release -f ${{ inputs.framework || 'net11.0' }} --no-build -- --self-test
          dotnet run --project tools/DotJpegli.Performance -c Release -f net11.0 --no-build -- --self-test-revision-comparison
      - name: Compare selected encoding cases (CI only; no full parity verdict)
        id: targeted
        env:
          DOTJPEGLI_PERFORMANCE_REVISION: ${{ github.sha }}
          DOTNET_TieredCompilation: '0'
        run: |
          cpu=$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)
          args=(--diagnostic --images "$TARGET_IMAGES" --distances "$TARGET_DISTANCES" --samplings "$TARGET_SAMPLINGS" --progressions "$TARGET_PROGRESSIONS" --blocks "$TARGET_BLOCKS" --warmups "$TARGET_WARMUPS")
          if [[ -n "$TARGET_ITERATIONS" ]]; then args+=(--iterations "$TARGET_ITERATIONS"); fi
          taskset -c "$cpu" dotnet run --project tools/DotJpegli.Performance -c Release -f ${{ inputs.framework || 'net11.0' }} --no-build -- --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/performance-evidence" "${args[@]}"
      - name: Build fixed encoder baseline with the identical measurement worker
        id: baseline_build
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[compare-baseline]') && (steps.targeted.outcome == 'success' || steps.targeted.outcome == 'failure')
        run: |
          git fetch --no-tags --depth=1 origin "$BASELINE_REVISION"
          lane="${{ runner.temp }}/encoder-baseline-source"
          mkdir -p "$lane"
          git archive "$BASELINE_REVISION" | tar -x -C "$lane"
          cd "$lane"
          dotnet restore src/DotJpegli/DotJpegli.csproj --locked-mode
          dotnet build src/DotJpegli/DotJpegli.csproj -c Release -f net11.0 --no-restore -p:SourceRevisionId="$BASELINE_REVISION"
          worker="${{ runner.temp }}/baseline-worker"
          mkdir -p "$worker"
          cp "${{ github.workspace }}/tools/DotJpegli.Performance/bin/Release/net11.0/"* "$worker/"
          cp "$lane/src/DotJpegli/bin/Release/net11.0/DotJpegli.dll" "$worker/DotJpegli.dll"
      - name: Interleave baseline and current on the same CPU (CI only)
        id: baseline_measure
        if: always() && steps.baseline_build.outcome == 'success' && (steps.targeted.outcome == 'success' || steps.targeted.outcome == 'failure')
        env:
          DOTNET_TieredCompilation: '0'
        run: |
          cpu=$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)
          taskset -c "$cpu" dotnet "${{ github.workspace }}/tools/DotJpegli.Performance/bin/Release/net11.0/DotJpegli.Performance.dll" --compare-revisions --baseline-runner "${{ runner.temp }}/baseline-worker/DotJpegli.Performance.dll" --baseline-revision "$BASELINE_REVISION" --current-revision "${{ github.sha }}" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/baseline-comparison" --images "$TARGET_IMAGES" --distances "$TARGET_DISTANCES" --samplings "$TARGET_SAMPLINGS" --progressions "$TARGET_PROGRESSIONS" --blocks 6 --iterations 20 --warmups 5
      - name: Interleave narrow SIMD revisions on the same CPU (CI only)
        id: avx2_measure
        if: always() && steps.baseline_build.outcome == 'success' && (steps.targeted.outcome == 'success' || steps.targeted.outcome == 'failure')
        env:
          DOTNET_EnableAVX512: '0'
          DOTNET_TieredCompilation: '0'
        run: |
          cpu=$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)
          taskset -c "$cpu" dotnet "${{ github.workspace }}/tools/DotJpegli.Performance/bin/Release/net11.0/DotJpegli.Performance.dll" --compare-revisions --baseline-runner "${{ runner.temp }}/baseline-worker/DotJpegli.Performance.dll" --baseline-revision "$BASELINE_REVISION" --current-revision "${{ github.sha }}" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/baseline-avx2-comparison" --images "$TARGET_IMAGES" --distances "$TARGET_DISTANCES" --samplings "$TARGET_SAMPLINGS" --progressions "$TARGET_PROGRESSIONS" --blocks 6 --iterations 20 --warmups 5
      - name: Publish interleaved revision reports
        if: always() && steps.baseline_build.outcome == 'success'
        run: |
          for evidence in baseline-comparison baseline-avx2-comparison; do
            if [[ -f "${{ runner.temp }}/$evidence/report.md" ]]; then
              cat "${{ runner.temp }}/$evidence/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Retain the optional same-host baseline diagnostic
        if: always() && steps.baseline_build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-baseline-${{ github.sha }}
          path: |
            ${{ runner.temp }}/baseline-comparison/
            ${{ runner.temp }}/baseline-avx2-comparison/
          retention-days: 30
          if-no-files-found: warn
      - name: Install pinned CPU diagnostic tool after selected-case failure
        id: profiler
        if: failure() && steps.targeted.outcome == 'failure' && (github.event_name == 'push' || inputs.profile)
        continue-on-error: true
        timeout-minutes: 3
        working-directory: ${{ runner.temp }}
        run: dotnet tool install dotnet-trace --version 10.0.750501 --tool-path "${{ runner.temp }}/diagnostic-tools" 2>&1 | tee "${{ runner.temp }}/performance-profile-install.log"
      - name: Profile one encoding case (instrumented diagnostic only)
        id: profile
        if: failure() && steps.targeted.outcome == 'failure' && steps.profiler.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}
        env:
          DOTJPEGLI_PERFORMANCE_REVISION: ${{ github.sha }}
          DOTNET_TieredCompilation: '0'
          DOTJPEGLI_PERFORMANCE_INSTRUMENTATION: 'dotnet-trace 10.0.750501; dotnet-sampled-thread-time; profiling timings are not acceptance evidence'
        run: |
          cpu=$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)
          read -r image sampling progression distance < <(pwsh -NoProfile -File "${{ github.workspace }}/tools/ci/performance-evidence.ps1" -SelectProfiles -Evidence "${{ runner.temp }}/performance-evidence")
          taskset -c "$cpu" "${{ runner.temp }}/diagnostic-tools/dotnet-trace" collect --profile dotnet-sampled-thread-time --format Speedscope --show-child-io --output "${{ runner.temp }}/performance-profile.nettrace" -- dotnet "${{ github.workspace }}/tools/DotJpegli.Performance/bin/Release/${{ inputs.framework || 'net11.0' }}/DotJpegli.Performance.dll" --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/profile-evidence" --diagnostic --images "$image" --distances "$distance" --samplings "$sampling" --progressions "$progression" --blocks 3 --iterations 20 --warmups 5 2>&1 | tee "${{ runner.temp }}/performance-profile.log"
      - name: Retain separate instrumented CPU diagnostics
        if: always() && steps.profiler.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-profile-${{ github.sha }}
          path: |
            ${{ runner.temp }}/performance-profile*
            ${{ runner.temp }}/profile-evidence/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish selected-case report in job summary
        if: always()
        run: |
          if [[ -f "${{ runner.temp }}/performance-evidence/report.md" ]]; then cat "${{ runner.temp }}/performance-evidence/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Retain selected-case evidence and native build provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-targeted-${{ github.sha }}
          path: |
            ${{ runner.temp }}/performance-evidence/
            ${{ runner.temp }}/parity-native/provenance.json
            ${{ runner.temp }}/parity-corpus/corpus.json
          retention-days: 30
          if-no-files-found: error

  release-regression:
    name: Release regression (${{ matrix.architecture }}, ${{ matrix.framework }}, ${{ matrix.simd }})
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[compare-release]') || contains(github.event.head_commit.message, '[compare-release-wide]'))
    needs: native-reference
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(contains(github.event.head_commit.message, '[compare-release-wide]')
          && '[{"runner":"ubuntu-latest","architecture":"X64","framework":"net11.0","simd":"default"}]'
          || '[{"runner":"ubuntu-latest","architecture":"X64","framework":"net10.0","simd":"default"},
          {"runner":"ubuntu-latest","architecture":"X64","framework":"net11.0","simd":"default"},
          {"runner":"ubuntu-latest","architecture":"X64","framework":"net10.0","simd":"avx2"},
          {"runner":"ubuntu-latest","architecture":"X64","framework":"net11.0","simd":"avx2"},
          {"runner":"ubuntu-24.04-arm","architecture":"ARM64","framework":"net10.0","simd":"default"},
          {"runner":"ubuntu-24.04-arm","architecture":"ARM64","framework":"net11.0","simd":"default"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      # This is the source revision published as NuGet 1.0.0.
      BASELINE_REVISION: a40868bfdace7d737413085522a88d351aa16782
      DOTNET_TieredCompilation: '0'
      # Disable both diagnostic names so .NET 10 and 11 exercise AVX2 even on
      # an AVX-512 runner. The comparison verifies actual narrow capabilities.
      DOTNET_EnableAVX512F: ${{ matrix.simd == 'avx2' && '0' || '1' }}
      DOTNET_EnableAVX512: ${{ matrix.simd == 'avx2' && '0' || '1' }}
      DOTJPEGLI_REQUIRE_WIDE_SIMD: ${{ contains(github.event.head_commit.message, '[compare-release-wide]') && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.403
      # PPM inputs are architecture independent. No native executable is run by
      # this comparison, so reuse the corpus already prepared for the CI run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-reference-X64-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Build current release comparison worker
        id: current_build
        run: |
          dotnet restore tools/DotJpegli.Performance/DotJpegli.Performance.csproj --locked-mode
          dotnet build tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release -f ${{ matrix.framework }} --no-restore -p:SourceRevisionId="${{ github.sha }}"
          dotnet tools/DotJpegli.Performance/bin/Release/${{ matrix.framework }}/DotJpegli.Performance.dll --self-test-revision-comparison
      - name: Build released sources with the same SDK and worker
        run: |
          git fetch --no-tags --depth=1 origin "$BASELINE_REVISION"
          lane="${{ runner.temp }}/released-encoder-source"
          worker="${{ runner.temp }}/released-encoder-worker"
          provenance="${{ runner.temp }}/release-build-provenance"
          mkdir -p "$lane" "$worker" "$provenance"
          git archive "$BASELINE_REVISION" | tar -x -C "$lane"
          cp global.json "$lane/global.json"
          assembly_version=$(dotnet msbuild src/DotJpegli/DotJpegli.csproj -nologo -p:TargetFramework=${{ matrix.framework }} -target:GetAssemblyVersion -getProperty:AssemblyVersion)
          [[ "$assembly_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Current assembly binding version is unavailable.'; exit 1; }
          {
            echo "Baseline source: $BASELINE_REVISION"
            echo "Current source: ${{ github.sha }}"
            echo "Framework: ${{ matrix.framework }}"
            echo "SIMD lane: ${{ matrix.simd }}"
            echo "Require accelerated Vector512 before measurement: $DOTJPEGLI_REQUIRE_WIDE_SIMD"
            echo "Workflow run attempt: ${{ github.run_attempt }}"
            echo "Baseline AssemblyVersion override for identical worker binding: $assembly_version"
            echo "Only global.json is copied from current into the released source tree."
            echo "Baseline restore reevaluates SDK-owned ILLink tasks for the identical current SDK."
            echo "Baseline static analyzers are disabled for SDK compatibility; current compilation keeps normal analyzer validation."
            dotnet --info
          } > "$provenance/build.txt"
          cp "$lane/src/DotJpegli/packages.lock.json" "$provenance/released-packages.lock.json"
          cd "$lane"
          dotnet restore src/DotJpegli/DotJpegli.csproj --force-evaluate
          cp src/DotJpegli/packages.lock.json "$provenance/rebuilt-packages.lock.json"
          sha256sum "$provenance/released-packages.lock.json" "$provenance/rebuilt-packages.lock.json" >> "$provenance/build.txt"
          dotnet build src/DotJpegli/DotJpegli.csproj -c Release -f ${{ matrix.framework }} --no-restore -p:SourceRevisionId="$BASELINE_REVISION" -p:AssemblyVersion="$assembly_version" -p:RunAnalyzers=false
          cp "${{ github.workspace }}/tools/DotJpegli.Performance/bin/Release/${{ matrix.framework }}/"* "$worker/"
          cp "$lane/src/DotJpegli/bin/Release/${{ matrix.framework }}/DotJpegli.dll" "$worker/DotJpegli.dll"
          sha256sum "$worker/DotJpegli.dll" "$worker/DotJpegli.Performance.dll" "${{ github.workspace }}/tools/DotJpegli.Performance/bin/Release/${{ matrix.framework }}/DotJpegli.dll" >> "$provenance/build.txt"
      - name: Compare all 256 cases with released 1.0.0 on the same CPU (CI only)
        id: release_measurement
        run: |
          cpu=$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)
          taskset -c "$cpu" dotnet "${{ github.workspace }}/tools/DotJpegli.Performance/bin/Release/${{ matrix.framework }}/DotJpegli.Performance.dll" --compare-revisions --release-regression --baseline-runner "${{ runner.temp }}/released-encoder-worker/DotJpegli.Performance.dll" --baseline-revision "$BASELINE_REVISION" --current-revision "${{ github.sha }}" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/release-regression"
      - name: Publish release regression report
        if: always()
        run: |
          if [[ -f "${{ runner.temp }}/release-regression/report.md" ]]; then
            cat "${{ runner.temp }}/release-regression/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain release regression evidence and build provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-regression-${{ matrix.architecture }}-${{ matrix.framework }}-${{ matrix.simd }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-regression/
            ${{ runner.temp }}/release-build-provenance/
          retention-days: 30
          if-no-files-found: warn

      - name: Compare retained algorithms on deterministic scenarios (CI diagnostic only)
        id: algorithm_scenarios
        if: always() && matrix.architecture == 'X64' && steps.current_build.outcome == 'success' && (steps.release_measurement.outcome == 'success' || steps.release_measurement.outcome == 'failure')
        continue-on-error: true
        run: |
          cpu=$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)
          default_worker="${{ runner.temp }}/algorithm-default-worker"
          scenarios="${{ runner.temp }}/algorithm-scenarios"
          mkdir -p "$default_worker" "$scenarios"
          cp "${{ github.workspace }}/tools/DotJpegli.Performance/bin/Release/${{ matrix.framework }}/"* "$default_worker/"
          variants=(sparse-transposed)
          if [[ '${{ matrix.framework }}' == 'net11.0' ]]; then variants+=(full-width-transpose); fi
          comparison_status=0
          for variant in "${variants[@]}"; do
            sparse=false
            transpose=false
            if [[ "$variant" == 'sparse-transposed' ]]; then sparse=true; else transpose=true; fi
            variant_root="$scenarios/$variant"
            provenance="$variant_root/build-provenance"
            worker="${{ runner.temp }}/algorithm-$variant-worker"
            library="${{ runner.temp }}/algorithm-$variant-library"
            mkdir -p "$provenance" "$worker" "$library"
            cp "$default_worker/"* "$worker/"
            {
              echo "Comparison: current default versus retained $variant algorithm"
              echo "Source for both workers: ${{ github.sha }}"
              echo "Framework: ${{ matrix.framework }}; SIMD lane: ${{ matrix.simd }}; CPU affinity: $cpu"
              echo 'Baseline flags: DotJpegliSparseTransposedQuantization=false; DotJpegliFullWidthTranspose=false'
              echo "Candidate flags: DotJpegliSparseTransposedQuantization=$sparse; DotJpegliFullWidthTranspose=$transpose"
              echo 'Selection: kodim01,kodim02,kodim04,kodim22,low-noise,low-contrast,full-noise,tiny-odd-edges; distances1/4; sampling444/420; progression0/2'
              echo 'Method: six balanced quartets, 20 encodes per leg (100 for tiny input), five warmups; no timing retries in this selected diagnostic'
            } > "$provenance/build.txt"
            if ! dotnet build src/DotJpegli/DotJpegli.csproj -c Release -f ${{ matrix.framework }} --no-restore -o "$library" -p:SourceRevisionId="${{ github.sha }}" -p:DotJpegliSparseTransposedQuantization="$sparse" -p:DotJpegliFullWidthTranspose="$transpose" 2>&1 | tee "$provenance/build.log"; then
              echo 'build failed' > "$provenance/exit-code.txt"
              comparison_status=2
              continue
            fi
            cp "$library/DotJpegli.dll" "$worker/DotJpegli.dll"
            sha256sum "$default_worker/DotJpegli.dll" "$worker/DotJpegli.dll" "$default_worker/DotJpegli.Performance.dll" "$worker/DotJpegli.Performance.dll" >> "$provenance/build.txt"
            verdict=0
            taskset -c "$cpu" dotnet "$worker/DotJpegli.Performance.dll" --compare-revisions --baseline-runner "$default_worker/DotJpegli.Performance.dll" --baseline-revision "${{ github.sha }}" --current-revision "${{ github.sha }}" --corpus "${{ runner.temp }}/parity-corpus" --output "$variant_root/evidence" --images kodim01,kodim02,kodim04,kodim22,low-noise,low-contrast,full-noise,tiny-odd-edges --distances 1,4 --samplings 444,420 --progressions 0,2 --blocks 6 --iterations 20 --warmups 5 || verdict=$?
            echo "$verdict" > "$provenance/exit-code.txt"
            if (( verdict > comparison_status )); then comparison_status=$verdict; fi
            {
              echo "# Retained algorithm scenarios: $variant"
              echo
              echo 'Baseline is the current default encoder. Candidate enables only the named retained algorithm through build flags; both use the same source revision and identical worker binaries.'
              echo
              echo "Framework: ${{ matrix.framework }}; architecture: ${{ matrix.architecture }}; SIMD lane: ${{ matrix.simd }}. Diagnostic exit code: $verdict."
              echo
              echo 'These selected results do not change production dispatch or the released-version regression verdict. Invalid and inconclusive rows remain in the report.'
              echo
              echo '[Comparison report](evidence/report.md) and [build flags and binary identities](build-provenance/build.txt).'
            } > "$variant_root/README.md"
          done
          exit "$comparison_status"
      - name: Record unreachable retained algorithms on ARM64
        if: always() && matrix.architecture == 'ARM64' && steps.current_build.outcome == 'success'
        run: |
          echo 'Retained sparse-transposed and full-width-transpose scenario comparisons are skipped on ARM64: these alternatives require accelerated eight-lane Vector256 operations, while this lane uses the unchanged four-lane path.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish retained algorithm scenario reports
        if: always() && steps.algorithm_scenarios.outcome != 'skipped'
        run: |
          for variant in sparse-transposed full-width-transpose; do
            evidence="${{ runner.temp }}/algorithm-scenarios/$variant/evidence/report.md"
            if [[ -f "$evidence" ]]; then
              echo "# Current default versus retained $variant algorithm (${{ matrix.framework }}, ${{ matrix.architecture }}, ${{ matrix.simd }})" >> "$GITHUB_STEP_SUMMARY"
              cat "$evidence" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Retain algorithm scenario evidence separately from the release gate
        if: always() && steps.algorithm_scenarios.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: algorithm-scenarios-${{ matrix.architecture }}-${{ matrix.framework }}-${{ matrix.simd }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/algorithm-scenarios/
          retention-days: 30
          if-no-files-found: warn

  runtime-comparison:
    if: inputs.compare_net11 || (github.event_name == 'push' && contains(github.event.head_commit.message, '[compare-net11]'))
    needs: native-reference
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.403
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-reference-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Build one net10.0 encoder binary with the pinned SDK
        run: |
          chmod +x "${{ runner.temp }}/parity-native/jpegli-parity-native"
          dotnet restore tools/DotJpegli.Performance/DotJpegli.Performance.csproj --locked-mode
          dotnet build tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release -f net10.0 --no-restore
      - name: Build isolated .NET 11 baseline and explicit SIMD experiment
        run: |
          lane="${{ runner.temp }}/net11-simd-source"
          mkdir -p "$lane"
          git archive HEAD | tar -x -C "$lane"
          cd "$lane"
          dotnet restore tools/DotJpegli.Performance/DotJpegli.Performance.csproj --locked-mode
          dotnet publish tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release -f net11.0 --no-restore --no-self-contained -p:DotJpegliNet11Simd=false -o "${{ runner.temp }}/net11-baseline"
          dotnet publish tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release -f net11.0 --no-restore --no-self-contained -p:DotJpegliNet11Simd=true -o "${{ runner.temp }}/net11-simd"
          dotnet restore tests/DotJpegli.Tests/DotJpegli.Tests.csproj --locked-mode
          dotnet build tests/DotJpegli.Tests/DotJpegli.Tests.csproj -c Release -f net11.0 --no-restore -p:DotJpegliNet11Simd=true
          dotnet tests/DotJpegli.Tests/bin/Release/net11.0/DotJpegli.Tests.dll -class DotJpegli.Tests.SimdDctTests -class DotJpegli.Tests.PlaneDctTests -class DotJpegli.Tests.EncoderSimdTests -class DotJpegli.Tests.Net11DctTransposeTests -class DotJpegli.Tests.SimdDownsamplingTests -class DotJpegli.Tests.Net11DownsamplingTests
      - name: Compare one case on both runtimes on the same CPU (CI only)
        working-directory: ${{ runner.temp }}
        env:
          DOTJPEGLI_PERFORMANCE_REVISION: ${{ github.sha }}
          DOTNET_TieredCompilation: '0'
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: '1'
        run: |
          cpu=$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)
          for runtime in 10.0.14 11.0.0-rc.3.26522.148; do
            set +e
            taskset -c "$cpu" dotnet --fx-version "$runtime" --roll-forward Disable "${{ github.workspace }}/tools/DotJpegli.Performance/bin/Release/net10.0/DotJpegli.Performance.dll" --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/runtime-$runtime" --diagnostic --images kodim01 --distances 1 --samplings 420 --progressions 0 --blocks 7 --iterations 20 --warmups 5
            verdict=$?
            set -e
            if [[ "$verdict" -gt 1 ]]; then exit "$verdict"; fi
          done
          for variant in net11-baseline net11-simd; do
            set +e
            taskset -c "$cpu" dotnet --fx-version 11.0.0-rc.3.26522.148 --roll-forward Disable "${{ runner.temp }}/$variant/DotJpegli.Performance.dll" --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/runtime-$variant" --diagnostic --images kodim01 --distances 1 --samplings 420 --progressions 0 --blocks 7 --iterations 20 --warmups 5
            verdict=$?
            set -e
            if [[ "$verdict" -gt 1 ]]; then exit "$verdict"; fi
          done
      - name: Report runtime and explicit SIMD comparisons
        shell: pwsh
        run: ./tools/ci/performance-evidence.ps1 -CompareRuntimes -Directory "${{ runner.temp }}"
      - name: Retain runtime comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-comparison-${{ runner.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runtime-10.0.14/
            ${{ runner.temp }}/runtime-11.0.0-rc.3.26522.148/
            ${{ runner.temp }}/runtime-net11-baseline/
            ${{ runner.temp }}/runtime-net11-simd/
            ${{ runner.temp }}/runtime-comparison.*
          retention-days: 30
          if-no-files-found: error

  quality-compression-parity:
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-parity]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    needs: native-reference
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-reference-X64-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Make downloaded native executable runnable
        run: chmod +x "${{ runner.temp }}/parity-native/jpegli-parity-native"
      - name: Restore and build managed comparison
        run: |
          dotnet restore tools/DotJpegli.Parity/DotJpegli.Parity.csproj --locked-mode
          dotnet build tools/DotJpegli.Parity/DotJpegli.Parity.csproj -c Release --no-restore
      - name: Verify comparison metrics and rate interpolation
        run: dotnet run --project tools/DotJpegli.Parity -c Release -f net11.0 --no-build -- --self-test
      - name: Compare matched quality and compression (CI only)
        env:
          DOTJPEGLI_PARITY_REVISION: ${{ github.sha }}
        run: dotnet run --project tools/DotJpegli.Parity -c Release -f net11.0 --no-build -- --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/parity-evidence"
      - name: Retain parity evidence and native build provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-compression-parity-${{ github.sha }}
          path: |
            ${{ runner.temp }}/parity-evidence/
            ${{ runner.temp }}/parity-native/provenance.json
            ${{ runner.temp }}/parity-corpus/corpus.json
          retention-days: 30
          if-no-files-found: error
      - name: Restore and build performance comparison
        run: |
          dotnet restore tools/DotJpegli.Performance/DotJpegli.Performance.csproj --locked-mode
          dotnet build tools/DotJpegli.Performance/DotJpegli.Performance.csproj -c Release --no-restore
      - name: Verify performance statistics and acceptance policy
        run: dotnet run --project tools/DotJpegli.Performance -c Release -f net11.0 --no-build -- --self-test
      - name: Compare steady-state encoding latency (CI only)
        id: performance
        env:
          DOTJPEGLI_PERFORMANCE_REVISION: ${{ github.sha }}
          DOTNET_TieredCompilation: '0'
        run: |
          cpu=$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)
          taskset -c "$cpu" dotnet run --project tools/DotJpegli.Performance -c Release -f net11.0 --no-build -- --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/performance-evidence"
      - name: Generate README charts from complete measurements
        if: ${{ !cancelled() && steps.performance.outcome != 'skipped' }}
        shell: pwsh
        run: ./tools/update-performance-charts.ps1 -Performance "${{ runner.temp }}/performance-evidence" -Quality "${{ runner.temp }}/parity-evidence" -Output "${{ runner.temp }}/performance-charts"
      - name: Retain generated performance charts
        if: ${{ !cancelled() && steps.performance.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-charts-${{ github.sha }}
          path: ${{ runner.temp }}/performance-charts/
          retention-days: 30
          if-no-files-found: warn
      - name: Retain performance evidence and native build provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-parity-${{ github.sha }}
          path: |
            ${{ runner.temp }}/performance-evidence/
            ${{ runner.temp }}/parity-native/provenance.json
            ${{ runner.temp }}/parity-corpus/corpus.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish full quality and performance reports in job summary
        if: always()
        run: |
          for report in "${{ runner.temp }}/parity-evidence/report.md" "${{ runner.temp }}/performance-evidence/report.md"; do
            if [[ -f "$report" ]]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Install pinned CPU diagnostics after full latency failure
        id: full_profiler
        if: failure() && steps.performance.outcome == 'failure' && (github.event_name == 'push' || inputs.profile)
        continue-on-error: true
        timeout-minutes: 3
        working-directory: ${{ runner.temp }}
        run: dotnet tool install dotnet-trace --version 10.0.750501 --tool-path "${{ runner.temp }}/diagnostic-tools" 2>&1 | tee "${{ runner.temp }}/full-performance-profile-install.log"
      - name: Profile worst images and failing smallest input (instrumented diagnostic only)
        if: failure() && steps.performance.outcome == 'failure' && steps.full_profiler.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}
        env:
          DOTJPEGLI_PERFORMANCE_REVISION: ${{ github.sha }}
          DOTNET_TieredCompilation: '0'
          DOTJPEGLI_PERFORMANCE_INSTRUMENTATION: 'dotnet-trace 10.0.750501; dotnet-sampled-thread-time; profiling timings are not acceptance evidence'
        run: |
          cpu=$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)
          pwsh -NoProfile -File "${{ github.workspace }}/tools/ci/performance-evidence.ps1" -SelectProfiles -Evidence "${{ runner.temp }}/performance-evidence" -Full > "${{ runner.temp }}/full-performance-profile-selection.txt"
          while read -r image sampling progression distance; do
            if ! taskset -c "$cpu" "${{ runner.temp }}/diagnostic-tools/dotnet-trace" collect --profile dotnet-sampled-thread-time --format Speedscope --show-child-io --output "${{ runner.temp }}/full-performance-profile-$image.nettrace" -- dotnet "${{ github.workspace }}/tools/DotJpegli.Performance/bin/Release/net11.0/DotJpegli.Performance.dll" --native "${{ runner.temp }}/parity-native/jpegli-parity-native" --corpus "${{ runner.temp }}/parity-corpus" --output "${{ runner.temp }}/full-performance-profile-evidence-$image" --diagnostic --images "$image" --distances "$distance" --samplings "$sampling" --progressions "$progression" --blocks 7 --iterations 100 --warmups 5 2>&1 | tee "${{ runner.temp }}/full-performance-profile-$image.log"; then
              echo "Profiler or instrumented comparison returned nonzero; diagnostic evidence retained."
            fi
          done < "${{ runner.temp }}/full-performance-profile-selection.txt"
      - name: Retain separate full-run instrumented CPU diagnostics
        if: always() && steps.full_profiler.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-profile-${{ github.sha }}
          path: ${{ runner.temp }}/full-performance-profile*
          retention-days: 30
          if-no-files-found: warn
