name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact package version already committed and built by CI (for example, 1.0.0)'
        required: true
        type: string
      publish:
        description: 'Publish NuGet and a GitHub release with CLI downloads after environment approval; false previews artifacts'
        type: boolean
        default: false

concurrency:
  group: nuget-publication
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify tested release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}
      artifact-id: ${{ steps.ci.outputs.artifact-id }}
      release-artifact-id: ${{ steps.release.outputs.artifact-id }}
    steps:
      - name: Require main and a successful CI run for this exact revision
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" != refs/heads/main ]]; then
            echo '::error::Run this workflow on main.'
            exit 1
          fi
          runs=$(gh api --method GET "repos/$REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$REVISION" -f per_page=100)
          run_id=$(jq -er --arg sha "$REVISION" --arg repo "$REPOSITORY" '
            [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main"
              and .event == "push" and .head_repository.full_name == $repo)]
            | first | if .status == "completed" and .conclusion == "success" then .id
              else error("The latest push CI run for this commit must finish successfully; reuse or rerun that CI run.") end
          ' <<< "$runs")
          artifacts=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[]')
          artifact_id=$(jq -ser --arg sha "$REVISION" '
            ["nuget-" + $sha, "cli-win-x64-" + $sha, "cli-win-arm64-" + $sha, "cli-linux-x64-" + $sha, "cli-linux-arm64-" + $sha, "cli-osx-arm64-" + $sha] as $names
            | [ $names[] as $name
              | ([.[] | select(.name == $name and .expired == false)]
                | sort_by(.id) | last
                | .id // error("Missing unexpired CI artifact: " + $name)) ]
            | map(tostring) | join(",")
          ' <<< "$artifacts")
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact-id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "Validated CI: https://github.com/$REPOSITORY/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"
      - name: Check GitHub release state before publishing to NuGet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::The combined CLI/MSI release requires a stable three-part version.'; exit 1; }
          tag="v$VERSION"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > "$RUNNER_TEMP/release-tag.json" 2> "$RUNNER_TEMP/release-tag-error.txt"; then
            object_type=$(jq -r '.object.type' "$RUNNER_TEMP/release-tag.json")
            object_sha=$(jq -r '.object.sha' "$RUNNER_TEMP/release-tag.json")
            while [[ "$object_type" == tag ]]; do
              object=$(gh api "repos/$GH_REPO/git/tags/$object_sha")
              object_type=$(jq -r '.object.type' <<< "$object")
              object_sha=$(jq -r '.object.sha' <<< "$object")
            done
            [[ "$object_type" == commit && "$object_sha" == "$REVISION" ]] || { echo '::error::Release tag points to another revision.'; exit 1; }
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/release-tag-error.txt" || { cat "$RUNNER_TEMP/release-tag-error.txt"; exit 1; }
          fi
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release-state.json" 2> "$RUNNER_TEMP/release-state-error.txt"; then
            [[ $(jq -r '.isDraft' "$RUNNER_TEMP/release-state.json") == true ]] || { echo '::error::This release is already published.'; exit 1; }
          else
            grep -qi 'not found' "$RUNNER_TEMP/release-state-error.txt" || { cat "$RUNNER_TEMP/release-state-error.txt"; exit 1; }
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET for compiled package verification
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download the package and CLI artifacts built and tested by CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.ci.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Check the requested version, artifact set and SHA-256 manifest
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          #requires -Version 7.6
          Set-StrictMode -Version 3.0
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore tools/DotJpegli.Automation/DotJpegli.Automation.csproj --locked-mode
          dotnet run --project tools/DotJpegli.Automation/DotJpegli.Automation.csproj -c Release --no-restore -- release `
            --release-directory (Join-Path $env:RUNNER_TEMP 'release') --version $env:EXPECTED_VERSION --revision $env:EXPECTED_REVISION
      - name: Retain the verified release and checksum manifest
        id: release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-${{ github.sha }}
          path: ${{ runner.temp }}/release/*
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish verified package to nuget.org
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: nuget
      url: https://www.nuget.org/packages/DotJpegli
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Require NuGet account configuration
        shell: bash
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo '::error::Set NUGET_USER to the nuget.org profile name in the nuget environment.'
            exit 1
          fi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.403
      - name: Download the same verified CI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.release-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/nuget
          github-token: ${{ github.token }}
      - name: Authenticate to nuget.org with OIDC
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push the tested package
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/nuget/*.nupkg)
          if [[ ${#packages[@]} != 1 ]]; then
            echo '::error::Expected exactly one NuGet package.'
            exit 1
          fi
          dotnet nuget push "${packages[0]}" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  github-release:
    name: Publish GitHub release downloads
    if: inputs.publish
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the same verified release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.release-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release
          github-token: ${{ github.token }}
      - name: Verify checksums and publish a release for the tested revision
        shell: bash
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          tag="v$VERSION"
          # Refuse to attach this commit's files to a tag naming another commit.
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > "$RUNNER_TEMP/release-tag.json" 2> "$RUNNER_TEMP/release-tag-error.txt"; then
            object_type=$(jq -r '.object.type' "$RUNNER_TEMP/release-tag.json")
            object_sha=$(jq -r '.object.sha' "$RUNNER_TEMP/release-tag.json")
            while [[ "$object_type" == tag ]]; do
              object=$(gh api "repos/$GH_REPO/git/tags/$object_sha")
              object_type=$(jq -r '.object.type' <<< "$object")
              object_sha=$(jq -r '.object.sha' <<< "$object")
            done
            [[ "$object_type" == commit && "$object_sha" == "$REVISION" ]] || { echo '::error::Release tag points to another revision.'; exit 1; }
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/release-tag-error.txt" || { cat "$RUNNER_TEMP/release-tag-error.txt"; exit 1; }
          fi
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release-state.json" 2> "$RUNNER_TEMP/release-state-error.txt"; then
            [[ $(jq -r '.isDraft' "$RUNNER_TEMP/release-state.json") == true ]] || { echo '::error::This release is already published.'; exit 1; }
          else
            grep -qi 'not found' "$RUNNER_TEMP/release-state-error.txt" || { cat "$RUNNER_TEMP/release-state-error.txt"; exit 1; }
            gh release create "$tag" --target "$REVISION" --title "DotJpegli $VERSION" --generate-notes --draft
          fi
          # Attach everything before publication, including on repositories with immutable releases.
          gh release edit "$tag" --target "$REVISION"
          gh release upload "$tag" ./*.nupkg ./*.exe ./*.zip ./*.msi ./*.tar.gz ./*.deb ./*.rpm ./*.AppImage ./*.flatpak ./*.pkg SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --latest
